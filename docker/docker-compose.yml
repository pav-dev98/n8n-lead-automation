services:

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8npass
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8npass
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false
      WEBHOOK_AUTH_TOKEN: "Bearer 92c70fc95ba4682f1b27ac357c9e78abddcdebe51f4ff39dfc256315a4e78efd"
    volumes:
      - ~/.n8n:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  postgres_data:
